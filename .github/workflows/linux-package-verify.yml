# Verifies the published Linux packages actually work, on Linux.
#
# The release workflow proves the packages build and that the packaged paths are
# correct. That is not the same claim as "these run on a Debian box": a missing
# shared library, a broken desktop entry or a payload in the wrong place all
# survive packaging and only appear when someone installs the file.
#
# This workflow therefore installs and inspects the real assets of a release:
#
#   1. the sha512 in latest-linux.yml must match every downloaded asset
#   2. the .deb is installed with dpkg (dependencies resolved), and every shared
#      library its binary needs must resolve
#   3. the .rpm is unpacked with rpm2cpio, and the same library check runs on it
#   4. the AppImage is extracted with its own runtime, and the same check runs
#   5. each package must ship a desktop entry and icons, so the app appears in
#      the application menu
#
# Run it against any release tag:
#   gh workflow run linux-package-verify.yml -f tag_name=v1.13.0
name: Verify Linux Packages

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: Release tag whose Linux assets to verify (e.g. v1.13.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: linux-package-verify-${{ github.event.inputs.tag_name }}
  cancel-in-progress: false

jobs:
  verify-linux-packages:
    name: Verify the Linux packages run
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download the release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p assets
          gh release download "${{ github.event.inputs.tag_name }}" \
            --repo "${{ github.repository }}" \
            --pattern "OraxRecordly-linux-x64.*" \
            --pattern "latest-linux.yml" \
            --dir assets
          ls -la assets

      - name: Check the checksums in latest-linux.yml match the files
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("node:fs");
          const crypto = require("node:crypto");
          const path = require("node:path");

          const dir = "assets";
          const yml = fs.readFileSync(path.join(dir, "latest-linux.yml"), "utf8");
          const files = [...yml.matchAll(/- url: (.+)\n\s+sha512: (.+)\n\s+size: (\d+)/g)];
          if (files.length === 0) throw new Error("latest-linux.yml lists no files");

          let failed = false;
          for (const [, url, sha512, size] of files) {
            const file = path.join(dir, url.trim());
            if (!fs.existsSync(file)) { console.error(`missing asset: ${url}`); failed = true; continue; }
            const bytes = fs.readFileSync(file);
            const digest = crypto.createHash("sha512").update(bytes).digest("base64");
            const okSize = bytes.length === Number(size);
            const okHash = digest === sha512.trim();
            console.log(`${okSize && okHash ? "ok  " : "FAIL"} ${url} size=${bytes.length}/${size} sha512=${okHash ? "match" : "MISMATCH"}`);
            if (!okSize || !okHash) failed = true;
          }
          if (failed) process.exit(1);
          NODE

      - name: Check every shared library of a package resolves
        run: |
          set -euo pipefail

          # The binary is discovered the way the operating system discovers it: from
          # the desktop entry's Exec= line. Guessing a file name is how the first run
          # of this workflow reported "no executable" for three healthy packages -
          # the executable is called `recordly`, not the product name.
          binary_from_desktop() {
            local desktop="$1"
            local root="$2"
            local exec_line
            exec_line="$(grep -m1 '^Exec=' "$desktop" | sed 's/^Exec=//' | awk '{print $1}')"
            if [ -z "$exec_line" ]; then
              return 1
            fi
            if [[ "$exec_line" == /* ]]; then
              echo "$exec_line"
              return 0
            fi
            if [ -n "$root" ] && [ -f "$root/$exec_line" ]; then
              echo "$root/$exec_line"
              return 0
            fi
            # A bare command name or a relative AppRun path: look for the payload
            # binary next to it.
            local candidate
            candidate="$(find "$root" -maxdepth 3 -type f -executable -name 'recordly' 2>/dev/null | head -n 1)"
            if [ -n "$candidate" ]; then
              echo "$candidate"
              return 0
            fi
            command -v "$exec_line" || return 1
          }

          check_binary() {
            local binary="$1"
            local label="$2"
            if [ ! -f "$binary" ] || [ ! -x "$binary" ]; then
              echo "FAIL $label: no executable at ${binary:-<none>}"
              return 1
            fi
            local missing
            missing="$(ldd "$binary" 2>&1 | grep 'not found' || true)"
            if [ -n "$missing" ]; then
              echo "FAIL $label: unresolved shared libraries:"
              echo "$missing"
              return 1
            fi
            echo "ok   $label: all $(ldd "$binary" | wc -l) shared libraries resolve"
            return 0
          }

          # Launches the packaged app on a virtual display. A crash on start is the
          # failure this catches; staying up until the timeout is the pass (an
          # Electron app has no --version to answer with).
          check_launches() {
            local binary="$1"
            local label="$2"
            local log
            log="$(mktemp)"
            set +e
            timeout 30 xvfb-run -a -s "-screen 0 1280x800x24" \
              "$binary" --no-sandbox --disable-gpu --disable-dev-shm-usage >"$log" 2>&1
            local code=$?
            set -e
            if [ $code -eq 124 ] || [ $code -eq 0 ]; then
              echo "ok   $label: launched without crashing"
              return 0
            fi
            echo "FAIL $label: exited with $code"
            tail -n 25 "$log" || true
            return 1
          }

          status=0

          # 1. The .deb, installed the way a user installs it.
          deb="$(ls assets/*.deb)"
          deb_package="$(dpkg-deb -f "$deb" Package)"
          sudo dpkg -i "$deb" || sudo apt-get -f install -y
          deb_desktop="$(dpkg -L "$deb_package" | grep '\.desktop$' | head -n 1)"
          if [ -z "$deb_desktop" ]; then
            echo "FAIL deb: no desktop entry"
            status=1
          else
            echo "ok   deb: desktop entry $deb_desktop"
            deb_binary="$(binary_from_desktop "$deb_desktop" "" || true)"
            check_binary "$deb_binary" "deb" || status=1
            check_launches "$deb_binary" "deb" || status=1
          fi
          if [ "$(dpkg -L "$deb_package" | grep -c 'share/icons')" -eq 0 ]; then
            echo "FAIL deb: no icons"
            status=1
          else
            echo "ok   deb: icons shipped"
          fi

          # 2. The .rpm, unpacked without installing (its payload is what matters).
          rpm="$(ls assets/*.rpm)"
          rpm_dir="$(mktemp -d)"
          (cd "$rpm_dir" && rpm2cpio "$OLDPWD/$rpm" | cpio -idm --quiet)
          rpm_desktop="$(find "$rpm_dir" -name '*.desktop' | head -n 1)"
          if [ -z "$rpm_desktop" ]; then
            echo "FAIL rpm: no desktop entry"
            status=1
          else
            echo "ok   rpm: desktop entry shipped"
            rpm_binary="$(binary_from_desktop "$rpm_desktop" "$rpm_dir" || true)"
            check_binary "$rpm_binary" "rpm" || status=1
            check_launches "$rpm_binary" "rpm" || status=1
          fi
          if [ "$(find "$rpm_dir" -path '*share/icons*' | wc -l)" -eq 0 ]; then
            echo "FAIL rpm: no icons"
            status=1
          else
            echo "ok   rpm: icons shipped"
          fi

          # 3. The AppImage, extracted with its own runtime (no FUSE needed).
          appimage="$(ls assets/*.AppImage)"
          chmod +x "$appimage"
          appimage_dir="$(mktemp -d)"
          (cd "$appimage_dir" && "$OLDPWD/$appimage" --appimage-extract >/dev/null)
          appimage_root="$appimage_dir/squashfs-root"
          if [ ! -f "$appimage_root/AppRun" ]; then
            echo "FAIL AppImage: no AppRun"
            status=1
          else
            echo "ok   AppImage: AppRun present"
          fi
          appimage_desktop="$(find "$appimage_root" -name '*.desktop' | head -n 1)"
          if [ -z "$appimage_desktop" ]; then
            echo "FAIL AppImage: no desktop entry"
            status=1
          else
            echo "ok   AppImage: desktop entry shipped"
            appimage_binary="$(binary_from_desktop "$appimage_desktop" "$appimage_root" || true)"
            check_binary "$appimage_binary" "AppImage" || status=1
            check_launches "$appimage_binary" "AppImage" || status=1
          fi

          exit $status
